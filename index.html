<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo homemadeSUTOM</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>

<body>
    <header>
        <p>Bienvenue sur la démo interactive d'homemadeSUTOM</p>
    </header>
    <main>
        <h1 class="homepage_title">homemadeSUTOM</h1>

        <div class="timerZone">
            <button id="decrementButton">Lancer le mode contre-la-montre</button>
            <div class="timerNumbers"></div>
        </div>

        <div class="letterBoxesObserver">
            <div class="letterBoxes"></div>
        </div>

        <div class="virtualKeyboard">
            <div class="keyboardLetters">
            </div> <br>
            <button id="eraseLetterButton"> <- </button> <button id="enterButton"> ENTER </button>
        </div>

    </main>
    <footer>
        <p>Inspiré par <a target="_blank" href="https://sutom.nocle.fr/">SUTOM de Jonathan Magano</a></p>
    </footer>
</body>

</html>
